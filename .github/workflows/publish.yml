name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Upload target"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pyyaml pytest

      - name: Install package (editable)
        run: pip install -e .

      - name: Build lexicon.pkl from committed CSV
        run: python scripts/build_pickle.py

      - name: Verify pickle was created
        run: |
          test -f src/zomi_g2p/data/lexicon.pkl || (echo "pickle missing" && exit 1)
          ls -lh src/zomi_g2p/data/lexicon.pkl

      - name: Run tests
        run: pytest -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Inspect wheel for data files
        run: |
          unzip -l dist/*.whl | grep -E "lexicon\.(csv|pkl)|segments\.yaml|tones\.yaml"

      - name: Check with twine
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Publish to TestPyPI
        if: startsWith(github.ref, 'refs/tags/') || inputs.target == 'testpypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --repository testpypi --verbose dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "📦 RELEASE SUMMARY"
          echo "=========================================="
          echo "Ref:     ${{ github.ref }}"
          echo "Event:   ${{ github.event_name }}"
          echo "Target:  ${{ inputs.target || 'tag' }}"
          echo ""
          echo "Files:"
          ls -la dist/
          echo "=========================================="